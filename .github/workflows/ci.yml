name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Build (warnings are errors)
        run: make CC=${{ matrix.cc }} CFLAGS="-O2 -g -Werror"
      - name: Test
        run: make test

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test with ASan + UBSan
        run: make SAN=1 CC=gcc test
